<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2233"/>
      <stop offset="60%" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a7a"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#4cc9f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative ladder -->
  <g opacity="0.9" transform="translate(90 150)">
    <line x1="30" y1="300" x2="60" y2="40" stroke="#4cc9f0" stroke-width="9" stroke-linecap="round"/>
    <line x1="110" y1="300" x2="140" y2="40" stroke="#4cc9f0" stroke-width="9" stroke-linecap="round"/>
    <g stroke="#4cc9f0" stroke-width="7" stroke-linecap="round">
      <line x1="36" y1="266" x2="116" y2="266"/>
      <line x1="46" y1="218" x2="126" y2="218"/>
      <line x1="57" y1="170" x2="137" y2="170"/>
      <line x1="67" y1="122" x2="147" y2="122"/>
      <line x1="78" y1="74" x2="158" y2="74"/>
    </g>
  </g>

  <!-- decorative snake -->
  <path d="M1080 130 C 990 130, 1000 220, 1075 235 C 1150 250, 1145 330, 1065 345 C 1000 358, 1010 430, 1080 440"
        fill="none" stroke="#ff7a7a" stroke-width="20" stroke-linecap="round" opacity="0.92"/>
  <circle cx="1080" cy="440" r="18" fill="#ff9a9a"/>
  <circle cx="1074" cy="436" r="5" fill="#3a1020"/>
  <circle cx="1088" cy="436" r="5" fill="#3a1020"/>

  <!-- text -->
  <text x="600" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif"
        font-size="86" font-weight="800" fill="url(#title)">Snake &amp; Ladder</text>
  <text x="600" y="335" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif"
        font-size="30" fill="#9fb0d4">Climb the ladders. Dodge the snakes. Race to 100.</text>
  <text x="600" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif"
        font-size="26" font-weight="700" fill="#e8ecf5">Free online board game &#183; 2–4 players &#183; No signup</text>

  <!-- dice -->
  <g transform="translate(500 440)">
    <rect width="74" height="74" rx="16" fill="#2a3348" stroke="#46527a" stroke-width="2"/>
    <circle cx="20" cy="20" r="7" fill="#eef2ff"/>
    <circle cx="54" cy="20" r="7" fill="#eef2ff"/>
    <circle cx="37" cy="37" r="7" fill="#eef2ff"/>
    <circle cx="20" cy="54" r="7" fill="#eef2ff"/>
    <circle cx="54" cy="54" r="7" fill="#eef2ff"/>
  </g>
  <g transform="translate(600 440)">
    <rect width="74" height="74" rx="16" fill="#2a3348" stroke="#46527a" stroke-width="2"/>
    <circle cx="20" cy="20" r="7" fill="#eef2ff"/>
    <circle cx="54" cy="20" r="7" fill="#eef2ff"/>
    <circle cx="37" cy="37" r="7" fill="#eef2ff"/>
    <circle cx="20" cy="54" r="7" fill="#eef2ff"/>
    <circle cx="54" cy="54" r="7" fill="#eef2ff"/>
  </g>
</svg>
